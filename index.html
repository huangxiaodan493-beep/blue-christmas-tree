        const source = wish.orb.points.position;
        const colorRoll = random();
        const coreColor = makeColor(CONFIG.colors.wishCore);
        const coralColor = makeColor(CONFIG.colors.wishCoral);
        const edgeColor = makeColor(CONFIG.colors.wishEdge);
        const color = colorRoll > 0.84
          ? edgeColor
          : colorRoll > 0.52
            ? coralColor
            : coreColor;

        trail.positions[offset] = source.x + (random() - 0.5) * 0.24;
        trail.positions[offset + 1] = source.y + (random() - 0.5) * 0.24;
        trail.positions[offset + 2] = source.z + (random() - 0.5) * 0.24;

        setParticleColor(trail.colors, index, color, 0.92 + random() * 0.24);
        trail.sizes[index] = 0.34 + random() * 0.62;
        trail.alphas[index] = 0.72 + random() * 0.28;

        const life = 0.62 + random() * 0.78;
        trail.lives[index] = life;
        trail.maxLives[index] = life;
        trail.velocities[offset] = (random() - 0.5) * 0.12;
        trail.velocities[offset + 1] = -0.12 - random() * 0.18;
        trail.velocities[offset + 2] = (random() - 0.5) * 0.12;

        trail.positionAttribute.needsUpdate = true;
        trail.colorAttribute.needsUpdate = true;
        trail.sizeAttribute.needsUpdate = true;
        trail.alphaAttribute.needsUpdate = true;
        trail.cursor = (index + 1) % CONFIG.wish.trailCount;
      }

      function updateWishTrail(wish, delta) {
        const { trail } = wish;

        for (let index = 0; index < CONFIG.wish.trailCount; index += 1) {
          if (trail.lives[index] <= 0) {
            trail.alphas[index] = 0;
            continue;
          }

          trail.lives[index] = Math.max(0, trail.lives[index] - delta);
          if (trail.lives[index] === 0) {
            trail.alphas[index] = 0;
            continue;
          }

          const offset = index * 3;
          trail.positions[offset] += trail.velocities[offset] * delta;
          trail.positions[offset + 1] += trail.velocities[offset + 1] * delta;
          trail.positions[offset + 2] += trail.velocities[offset + 2] * delta;
          trail.velocities[offset + 1] -= delta * 0.035;

          const lifeRatio = trail.lives[index] / trail.maxLives[index];
          trail.alphas[index] = Math.pow(lifeRatio, 1.55);
        }

        trail.positionAttribute.needsUpdate = true;
        trail.alphaAttribute.needsUpdate = true;
      }


      function disposeWish(wish) {
        scene.remove(wish.orb.points);
        wish.orb.geometry.dispose();
        wish.orb.material.dispose();

        scene.remove(wish.trail.points);
        wish.trail.geometry.dispose();
        wish.trail.material.dispose();

        scene.remove(wish.flash);
        wish.flash.material.dispose();
      }

      function updateWishSystem(delta, elapsedTime) {
        for (let index = activeWishes.length - 1; index >= 0; index -= 1) {
          const wish = activeWishes[index];
          wish.orb.uniforms.uTime.value = elapsedTime;
          wish.orb.uniforms.uPixelRatio.value = renderer.getPixelRatio();
          wish.trail.uniforms.uTime.value = elapsedTime;
          wish.trail.uniforms.uPixelRatio.value = renderer.getPixelRatio();
          updateWishTrail(wish, delta);

          if (wish.phase === 'flight') {
            wish.age += delta;
            wish.progress = clamp01(wish.age / CONFIG.wish.duration);
            wish.target.copy(heart.group.position);
            const eased = quinticInOut(wish.progress);
            sampleCubicBezier(
              wish.pathPosition,
              wish.start,
              wish.controlA,
              wish.controlB,
              wish.target,
              eased,
            );

            wish.orb.points.position.copy(wish.pathPosition);
            wish.orb.points.rotation.y = elapsedTime * 1.65 + wish.id;
            wish.orb.points.rotation.x = Math.sin(elapsedTime * 0.8 + wish.id) * 0.2;

            const pulse = 1 + Math.sin(elapsedTime * 3.4 + wish.id) * 0.075;
            wish.orb.points.scale.setScalar(pulse);
            wish.flash.position.copy(wish.pathPosition);
            wish.flash.material.opacity = 0.12 + Math.sin(elapsedTime * 3.2) * 0.025;
            wish.flash.scale.setScalar(0.82 + Math.sin(elapsedTime * 2.5) * 0.08);

            wish.trailAccumulator += delta * CONFIG.wish.trailRate;
            while (wish.trailAccumulator >= 1) {
              emitWishTrail(wish);
              wish.trailAccumulator -= 1;
            }

            if (wish.progress >= 1) {
              wish.phase = 'finished';
              wish.finishedAge = 0;
              wish.orb.points.position.copy(wish.target);
              wish.orb.points.visible = false;
              wish.flash.visible = false;
              triggerHeartFirework(elapsedTime);
              setWishStatus('wish received · the heart blooms in gold', 'received');
            }
          } else {
            wish.finishedAge += delta;
            if (wish.finishedAge >= 2.15) {
              disposeWish(wish);
              activeWishes.splice(index, 1);
            }
          }
        }
      }

      function setWishStatus(message, state) {
        const status = document.getElementById('wish-status');
        if (!status) {
          return;
        }

        status.textContent = message;
        status.dataset.state = state;
      }

      function spawnWish() {
        if (activeWishes.length >= CONFIG.wish.maxActive) {
          setWishStatus('the tree is still carrying your last wishes', 'error');
          return false;
        }

        const wish = createWish();
        activeWishes.push(wish);
        return true;
      }

      function initializeWishUI() {
        const form = document.getElementById('wish-form');
        const input = document.getElementById('wish-input');

        if (!(form instanceof HTMLFormElement) || !(input instanceof HTMLInputElement)) {
          return;
        }

        form.addEventListener('submit', (event) => {
          event.preventDefault();
          const wishText = input.value.trim();

          if (wishText.length === 0) {
            form.classList.remove('is-invalid');
            void form.offsetWidth;
            form.classList.add('is-invalid');
            setWishStatus('a wish needs a little light to carry', 'error');
            input.focus();
            return;
          }

          form.classList.remove('is-invalid');
          if (!spawnWish()) {
            return;
          }

          input.value = '';
          input.focus();
          setWishStatus('your wish is rising toward the stars', 'sent');
        });

        input.addEventListener('input', () => {
          form.classList.remove('is-invalid');
          if (input.value.trim().length > 0) {
            setWishStatus('one wish at a time · the tree is listening', 'idle');
          }
        });
      }

      initializeWishUI();


      // === Post-processing ===

      const acesToneMappingPass = new ShaderPass(
        {
          name: 'AcesToneMappingShader',
          uniforms: {
            tDiffuse: { value: null },
            exposure: { value: CONFIG.renderer.exposure },
          },
          vertexShader: `
            varying vec2 vUv;

            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform float exposure;
            varying vec2 vUv;

            vec3 acesFilm(vec3 x) {
              const float a = 2.51;
              const float b = 0.03;
              const float c = 2.43;
              const float d = 0.59;
              const float e = 0.14;
              return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
            }

            void main() {
              vec4 texel = texture2D(tDiffuse, vUv);
              vec3 mapped = acesFilm(texel.rgb * exposure);
              gl_FragColor = vec4(mapped, texel.a);
            }
          `,
        },
        'tDiffuse',
      );

      const composer = new EffectComposer(renderer);
      composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      composer.setSize(window.innerWidth, window.innerHeight);
      composer.addPass(new RenderPass(scene, camera));

      const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        CONFIG.bloom.strength,
        CONFIG.bloom.radius,
        CONFIG.bloom.threshold,
      );
      composer.addPass(bloomPass);
      composer.addPass(acesToneMappingPass);
      composer.addPass(new OutputPass());

      // === Animation ===

      const clock = new THREE.Clock();
      const pointerTarget = new THREE.Vector3();
      const pointerCurrent = new THREE.Vector3();
      const cameraRight = new THREE.Vector3();
      const cameraUp = new THREE.Vector3();
      const cameraForward = new THREE.Vector3();
      const handWorldOffset = new THREE.Vector3();
      const heartBaseY =
        CONFIG.tree.height * 0.5 + CONFIG.heart.centerYOffset;

      function getHeartbeat(elapsedTime) {
        const phase = (elapsedTime * 1.18) % 1;
        const firstBeat = Math.exp(-Math.pow((phase - 0.09) * 15, 2));
        const secondBeat =
          0.58 * Math.exp(-Math.pow((phase - 0.25) * 20, 2));
        return Math.max(firstBeat, secondBeat);
      }

      function animate() {
        const delta = Math.min(clock.getDelta(), 0.05);
        const elapsedTime = clock.elapsedTime;

        currentExplode += (targetExplode - currentExplode) * CONFIG.tree.explodeSpeed;
        currentHandX += (targetHandX - currentHandX) * CONFIG.gesture.handFollowSpeed;
        currentHandY += (targetHandY - currentHandY) * CONFIG.gesture.handFollowSpeed;
        particleMaterial.uniforms.uExplode.value = currentExplode;

        tree.uniforms.uTime.value = elapsedTime;
        tree.uniforms.uPixelRatio.value = renderer.getPixelRatio();
        heart.uniforms.uTime.value = elapsedTime;
        heart.uniforms.uPixelRatio.value = renderer.getPixelRatio();
        snow.uniforms.uTime.value = elapsedTime;
        snow.uniforms.uPixelRatio.value = renderer.getPixelRatio();

        const heartbeat = getHeartbeat(elapsedTime);
        heart.group.position.y =
          heartBaseY + Math.sin(elapsedTime * 1.05) * 0.022;
        heart.group.rotation.y = elapsedTime * CONFIG.heart.rotationSpeed;

        goldenRings.rings.forEach((ring) => {
          ring.points.rotation.y += ring.speed * delta;
        });

        updateWishSystem(delta, elapsedTime);
        const heartFlare = getHeartFlareEnergy(elapsedTime);
        heart.uniforms.uHeartFlare.value = heartFlare;
        heart.group.scale.setScalar(
          (CONFIG.heart.displayScale + heartbeat * 0.055) * (
            1 + heartFlare * (CONFIG.heart.flareScale - 1)
          ),
        );
        updateHeartFirework(delta, elapsedTime);

        pointerTarget.set(
          controls.object.position.x * 0.0015,
          controls.object.position.y * 0.001,
          0,
        );
        pointerCurrent.lerp(pointerTarget, 1 - Math.exp(-delta * 2.5));
        tree.points.position.x = pointerCurrent.x;
        tree.points.position.y = pointerCurrent.y;

        controls.update();
        camera.updateMatrixWorld();
        cameraRight.setFromMatrixColumn(camera.matrixWorld, 0).normalize();
        cameraUp.setFromMatrixColumn(camera.matrixWorld, 1).normalize();
        cameraForward.setFromMatrixColumn(camera.matrixWorld, 2).normalize();
        particleMaterial.uniforms.uBurstRight.value.copy(cameraRight);
        particleMaterial.uniforms.uBurstUp.value.copy(cameraUp);
        particleMaterial.uniforms.uBurstForward.value.copy(cameraForward);
        handWorldOffset.set(0, 0, 0)
          .addScaledVector(cameraRight, currentHandX * CONFIG.gesture.handMoveRangeX)
          .addScaledVector(cameraUp, currentHandY * CONFIG.gesture.handMoveRangeY);
        particleMaterial.uniforms.uHandOffset.value.copy(handWorldOffset);

        composer.render();
      }

      renderer.setAnimationLoop(animate);

      // === Responsive ===

      function handleResize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const pixelRatio = Math.min(window.devicePixelRatio, 2);

        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(pixelRatio);
        renderer.setSize(width, height);
        composer.setPixelRatio(pixelRatio);
        composer.setSize(width, height);
        bloomPass.setSize(width, height);
      }

      window.addEventListener('resize', handleResize);

      const totalParticles =
        CONFIG.tree.count +
        CONFIG.heart.count +
        CONFIG.snow.count +
        CONFIG.rings.count * CONFIG.rings.radii.length;
      const indexElement = document.getElementById('particle-index');

      if (indexElement) {
        indexElement.textContent = `${Math.round(totalParticles / 1000)}K / 02`;
      }

      requestAnimationFrame(() => {
        document.getElementById('loading')?.classList.add('is-hidden');
      });
    
</script>
  </body>
</html>
